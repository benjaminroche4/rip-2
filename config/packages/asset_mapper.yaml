framework:
    asset_mapper:
        # The paths to make available to the asset mapper.
        paths:
            - assets/
        missing_import_mode: strict
        # Cloudflare Rocket Loader rewrites <script type> with a per-response
        # hash; Turbo then sees its data-turbo-track="reload" tags change on
        # every navigation and forces a full page reload. data-cfasync="false"
        # tells Rocket Loader to leave these scripts untouched.
        importmap_script_attributes:
            data-cfasync: 'false'

when@prod:
    framework:
        asset_mapper:
            missing_import_mode: warn
