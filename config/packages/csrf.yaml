# Enable stateless CSRF protection for forms and logins/logouts
framework:
    form:
        csrf_protection:
            token_id: submit

    csrf_protection:
        stateless_token_ids:
            - submit
            - authenticate
            - logout
            # Admin avatar upload: the form lives inside a LiveComponent edit
            # mode, so the token cannot be primed from a crawled page; the
            # stateless same-origin check fits this plain multipart POST.
            - user-avatar
