security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        # used to reload user from session & other features (e.g. switch_user)
        app_user_provider:
            entity:
                class: App\Auth\Entity\User
                property: email
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            # Blocks suspended accounts on every authentication path.
            user_checker: App\Auth\Security\UserChecker
            entry_point: form_login
            custom_authenticators:
                - App\Auth\Security\GoogleAuthenticator
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                success_handler: App\Auth\Security\LoginSuccessHandler
            logout:
                path: app_logout
                enable_csrf: true
                # where to redirect after logout
                # target: app_any_route
            login_throttling:
                max_attempts: 3
                interval: '15 minutes'
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800 # 1 week in seconds
            # activate different ways to authenticate
            # https://symfony.com/doc/current/security.html#the-firewall

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true

    # Easy way to control access for large sections of your site
    # Note: Only the *first* access control that matches will be used
    role_hierarchy:
        # Accès BO par section : ROLE_STAFF ouvre le back-office (dashboard),
        # chaque ROLE_SECTION_* ouvre sa section métier, ROLE_ADMIN a tout
        # (sections + gestion des utilisateurs).
        ROLE_ADMIN: [ROLE_USER, ROLE_STAFF, ROLE_SECTION_CONTACTS, ROLE_SECTION_DOSSIERS, ROLE_SECTION_VISITS, ROLE_SECTION_AGENTS, ROLE_SECTION_TOOLS]
        ROLE_SECTION_CONTACTS: ROLE_STAFF
        ROLE_SECTION_DOSSIERS: ROLE_STAFF
        ROLE_SECTION_VISITS: ROLE_STAFF
        ROLE_SECTION_AGENTS: ROLE_STAFF
        ROLE_SECTION_TOOLS: ROLE_STAFF
        ROLE_STAFF: ROLE_USER

    access_control:
        # Espace admin : URL = /{_locale}/{adminPrefix}/admin où adminPrefix est un secret
        # stocké dans %admin_path_prefix% (env ADMIN_PATH_PREFIX). Tout chemin différent
        # renvoie un 404 du router → pas de leak du format. Les sous-routes /admin/...
        # héritent de la même règle.
        #
        # Une règle par section métier (first match wins), puis la gestion des
        # utilisateurs réservée aux admins, et enfin le shell (dashboard)
        # ouvert à tout le staff.
        - { path: '^/(fr|en)/%admin_path_prefix%/admin/(outils|tools)($|/)', roles: ROLE_SECTION_TOOLS }
        - { path: '^/(fr|en)/%admin_path_prefix%/admin/contacts($|/)', roles: ROLE_SECTION_CONTACTS }
        - { path: '^/(fr|en)/%admin_path_prefix%/admin/(dossiers|files)($|/)', roles: ROLE_SECTION_DOSSIERS }
        - { path: '^/(fr|en)/%admin_path_prefix%/admin/(visites|visits)($|/)', roles: ROLE_SECTION_VISITS }
        - { path: '^/(fr|en)/%admin_path_prefix%/admin/(agents-immobiliers|real-estate-agents)($|/)', roles: ROLE_SECTION_AGENTS }
        - { path: '^/(fr|en)/%admin_path_prefix%/admin/(utilisateurs|users)($|/)', roles: ROLE_ADMIN }
        - { path: '^/(fr|en)/%admin_path_prefix%/admin($|/)', roles: ROLE_STAFF }

when@test:
    security:
        password_hashers:
            # By default, password hashers are resource intensive and take time. This is
            # important to generate secure password hashes. In tests however, secure hashes
            # are not important, waste resources and increase test times. The following
            # reduces the work factor to the lowest possible values.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
        firewalls:
            main:
                # Bump login_throttling in test so the suite, which fires repeated
                # logins for the same test user, doesn't trip the production limit
                # (3/15min) — the rate-limiter cache is filesystem-backed and
                # persists between runs, which would otherwise flake LoginControllerTest
                # and any test that calls submitForm() on the login form. The
                # production limit stays at 3 attempts above.
                login_throttling:
                    max_attempts: 1000
