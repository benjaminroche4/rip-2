redirect_fr:
    path: /fr
    controller: Symfony\Bundle\FrameworkBundle\Controller\RedirectController::redirectAction
    defaults:
        route: app_home
        permanent: true

# Bounded-context controllers (App\Marketing\Controller, App\Contact\Controller, App\Newsletter\Controller, …).
# Discovered by attribute scan; the namespace stays generic so future modules are picked up automatically.
controllers:
    requirements:
        _locale: en|fr
    resource:
        path: ../src/
        namespace: App
    type: attribute

