        award: 'Meilleure agence<br>à <span class="font-semibold">Paris en %year%</span>'
    faq:
        title: FAQ
        subTitle: Vos questions, nos réponses
        text: "Les questions les plus fréquentes des propriétaires. Retrouvez toutes nos réponses dans notre <a href='%url%#property-management' class='underline underline-offset-4 decoration-dotted decoration-slate-500 hover:decoration-primary hover:text-primary transition duration-100'>FAQ générale</a>."
        question:
            1:
                title: Gérez-vous les biens en courte, moyenne et longue durée ?
                text: Oui. Nous assurons la gestion locative en courte durée (jusqu’à 30 jours), en moyenne durée (de 1 à 6 mois) et en longue durée (au-delà de 6 mois), avec une approche adaptée à chaque typologie de location.
            2:
                title: Mettez-vous en valeur le bien avant la mise en location ?
                text: Oui. Nous travaillons la valorisation du bien avec un shooting photo professionnel, puis sa présentation, son positionnement et sa diffusion, afin d’attirer des profils de qualité et d’optimiser la performance locative.
            3:
                title: Gérez-vous tout de bout en bout ?
                text: "Absolument. Nous prenons en charge l’intégralité de la gestion : stratégie, diffusion, relation locataire, suivi opérationnel et gestion des revenus. Vous conservez le contrôle, nous gérons le reste."
            4:
                title: Étudiez-vous une stratégie pour optimiser mes revenus ?
                text: "Oui. Chaque bien fait l’objet d’une analyse personnalisée afin de définir la stratégie locative la plus pertinente, en fonction de sa localisation, de la demande et de vos objectifs. Pour commencer, <a href=\"%landlordsUrl%#estimation-card\">estimez le loyer de votre bien</a>."
            5:
                title: Gérez-vous la communication avec les voyageurs ou locataires ?
                text: Oui. Nous assurons l’ensemble des échanges avant, pendant et après le séjour ou la location, avec un suivi professionnel et réactif.
            6:
                title: Puis-je suivre les revenus générés ?
                text: Oui. Vous bénéficiez d’un suivi clair et régulier de vos revenus locatifs, avec une visibilité complète sur la performance de votre bien.
            7:
                title: Y a-t-il un engagement de durée ?
                text: Non. Notre accompagnement est <strong>sans engagement de durée</strong>, dans une logique de partenariat basé sur la confiance et la transparence.
            8:
                title: Dois-je avancer des frais ?
                text: "Non. <strong>Aucun frais de mise en place</strong> ni de coût à avancer : notre rémunération est alignée sur la performance de votre bien. <a href=\"%contactUrl%\">Contactez-nous</a> pour en parler."
            9:
                title: Quels profils de locataires proposez-vous ?
                text: "Grâce à notre activité de relocation, nous accompagnons des cadres, des expatriés et des <a href=\"%companiesUrl%\">collaborateurs d'entreprises</a> à la recherche d'un logement à Paris. Nous proposons ces <strong>profils premium</strong> en priorité pour votre bien, avec des dossiers vérifiés et des garanties solides."
