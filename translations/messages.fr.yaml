        alt: "Photo de Madison R., cliente satisfaite de Relocation In Paris"
    6:
        text: Retour en France après plusieurs années à l’étranger. Julien a géré les visites, le dossier et la négociation avec une grande efficacité. Nous avons trouvé rapidement un appartement qui correspondait parfaitement à nos attentes.
