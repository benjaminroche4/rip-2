faq:
    title: FAQ
    subTitle: Questions fréquentes sur la relocation à Paris
    intro: "Relocation, recherche de logement, dossier, offres, entreprises et propriétaires : toutes nos réponses, classées par thème."
    nav:
        title: Thèmes
        label: Thèmes de la FAQ
    help:
        title: Vous ne trouvez pas votre réponse ?
        text: Posez-nous directement votre question, un expert vous répond.
        button: Poser ma question
    categories:
        relocation: La relocation à Paris
        homeSearch: Recherche de logement
        rentingRules: "Louer à Paris : les règles"
        application: Dossier et démarches
        plansAndFees: Offres et honoraires
        companies: Entreprises
        propertyManagement: Gestion locative
    more:
        beyondHousing:
            title: Pouvez-vous m'aider pour le visa, la scolarité ou la conciergerie ?
            text: "Oui. Au-delà du logement, nous vous accompagnons sur les démarches liées au visa, la découverte des quartiers, la scolarité de vos enfants et des services de conciergerie, pour que votre installation à Paris ne laisse rien au hasard. Ces services sont présentés sur notre <a href=\"%pricingUrl%\">page tarifs</a>."
        languages:
            title: Dans quelles langues travaillez-vous ?
            text: "Notre équipe accompagne ses clients en français, en anglais, en espagnol et en allemand, du premier échange jusqu'à la remise des clés."
        contact:
            title: Comment vous contacter ou être rappelé ?
            text: "Par téléphone ou via notre <a href=\"%contactUrl%\">formulaire de contact</a>. Vous pouvez aussi <a href=\"%callbackUrl%\">demander à être rappelé</a> : choisissez votre créneau, et un expert vous appelle pour faire le point sur votre projet."
        whenToStart:
            title: Combien de temps avant mon arrivée dois-je commencer ma recherche ?
            text: <strong>Le plus tôt possible.</strong> Commencer tôt nous permet de vous proposer un maximum de biens et de repérer les meilleures offres avant qu'elles ne partent, sur un marché parisien où les bons logements se louent très vite. <a href="%contactUrl%">Contactez-nous</a> dès que votre projet se précise.
        temporaryHousing:
            title: Proposez-vous un logement temporaire le temps de la recherche ?
            text: "Oui, tout à fait. Si vous arrivez à Paris avant d'avoir trouvé votre logement, <strong>nous vous proposons un logement temporaire le temps de la recherche</strong>, pour vous installer sereinement dès votre arrivée."
        ourProperties:
            title: Comment visiter un bien présenté sur votre site ?
            text: "Les biens présentés sur notre page <a href=\"%propertiesUrl%\">Nos biens</a> sont des logements de notre réseau à louer à Paris. Contactez-nous en précisant le bien qui vous intéresse : nous organisons la visite, sur place ou à distance."
        guarantor:
            title: Faut-il un garant pour louer à Paris ?
            text: "Pas forcément. Les propriétaires demandent souvent un garant, mais il existe des alternatives : <strong>la garantie Visale</strong>, gratuite et proposée par Action Logement sous conditions d'éligibilité, une caution bancaire, ou une assurance loyers impayés souscrite par le propriétaire. Pour les expatriés sans garant en France, <a href=\"%findAccommodationUrl%\">nous construisons un dossier solide</a> et le défendons auprès de notre réseau de propriétaires."
        furnishedVsUnfurnished:
            title: "Location meublée ou vide : quelles différences ?"
            text: "Une location vide est conclue pour <strong>3 ans minimum</strong> avec un propriétaire particulier, une location meublée pour <strong>1 an (9 mois pour un étudiant)</strong>. Le dépôt de garantie est plafonné à 1 mois de loyer hors charges en location vide et à 2 mois en meublé. À Paris, zone tendue, le locataire peut donner congé avec un <strong>préavis d'un mois dans les deux cas</strong>. Retrouvez nos conseils détaillés sur <a href=\"%blogUrl%\">notre blog</a>."
        mobilityLease:
            title: Qu'est-ce que le bail mobilité ?
            text: "Le bail mobilité est un <strong>bail meublé de 1 à 10 mois</strong>, non renouvelable, réservé aux personnes en formation professionnelle, en études supérieures, en apprentissage, en stage, en service civique, en mutation professionnelle ou en mission temporaire. <strong>Aucun dépôt de garantie</strong> ne peut être demandé et le locataire peut partir à tout moment avec un préavis d'un mois. Une solution adaptée à une mission ou à une arrivée temporaire à Paris : pour la relocation de vos collaborateurs, découvrez notre <a href=\"%companiesUrl%\">offre entreprises</a>."
        rentControl:
            title: Comment fonctionne l'encadrement des loyers à Paris ?
            text: "À Paris, le loyer hors charges d'un logement ne peut pas dépasser un <strong>loyer de référence majoré</strong>, fixé chaque année par arrêté préfectoral selon le quartier, le nombre de pièces, l'époque de construction et le type de location (vide ou meublée). Un complément de loyer n'est possible que pour des caractéristiques exceptionnelles du logement, et le bail doit mentionner le loyer de référence et le loyer de référence majoré."
        moveInCosts:
            title: Quels frais prévoir à l'entrée dans le logement ?
            text: "Prévoyez le premier mois de loyer et de charges, <strong>le dépôt de garantie</strong> (1 mois de loyer hors charges en location vide, 2 mois en meublé), les éventuels honoraires de l'agence du propriétaire, plafonnés par la loi selon la surface, et <strong>votre assurance habitation</strong>, généralement exigée dès la remise des clés. <a href=\"%pricingUrl%\">Nos honoraires de relocation</a> sont indépendants de ces frais."
        prices:
            title: Combien coûtent vos offres ?
            text: "L'offre Accompagné coûte <strong>1 490 €</strong> et l'offre Confié <strong>2 190 €</strong>. Retrouvez le détail de ce que comprend chaque offre sur notre <a href=\"%pricingUrl%\">page tarifs</a>."
        rentEstimate:
            title: Comment estimer le loyer de mon bien ?
            text: "Remplissez notre <a href=\"%landlordsUrl%\">formulaire d'estimation</a> en quelques minutes : un expert analyse votre bien (localisation, surface, équipements, type de location) et revient vers vous avec une estimation de vos revenus locatifs."
    notes:
        propertyManagement:
            title: Une gestion locative en partenariat avec TheKonciergerie
            text: "Notre gestion locative est assurée en collaboration avec notre partenaire <a href=\"%partnerUrl%\" rel=\"noopener noreferrer\" target=\"_blank\">TheKonciergerie</a>."
    plans:
        difference:
            title: Quelle est la différence entre les offres Accompagné et Confié ?
            text: "Avec l'offre Accompagné, vous gagnez des semaines de recherche : <strong>vous visitez, nous gérons tout le reste</strong> (recherche sur mesure, accès aux biens off-market, optimisation de votre dossier, gestion des candidatures et des relances). Avec l'offre Confié, <strong>nous gérons tout, de la recherche à l'installation complète</strong> : votre agent assure les visites, vous envoie un compte-rendu vidéo après chacune d'elles et vous suit jusqu'à la remise des clés. Vous n'avez plus qu'à valider."
    1:
        title: Que se passe-t-il si vous ne trouvez pas de logement ?
        text: "Nous ne prenons pas une mission sans être certains de la réussir. Avec <strong>plus de 900 installations réussies</strong> et un réseau de partenaires unique sur Paris, nous n'avons jamais rendu un client sans clés."
    2:
        title: Sous combien de temps trouvez-vous un logement ?
        text: En moyenne, nos clients signent leur bail en <strong>moins de 20 jours</strong>. Sur un marché aussi tendu que Paris, c'est ce qui fait la différence entre chercher seul et chercher avec nous.
    3:
        title: Mon profil est atypique, pouvez-vous quand même m'aider ?
        text: C'est exactement pourquoi nous existons. Expatriés sans fiches de paie françaises, freelances, étrangers sans garant... notre réseau de propriétaires partenaires nous fait confiance, et cette confiance fait passer votre dossier.
    4:
        title: Mon loyer est-il suffisant pour trouver un bon appartement à Paris ?
        text: "Nous accompagnons les recherches <strong>à partir de 1 000 € de loyer par mois</strong>. Nous commençons toujours par un échange approfondi pour comprendre vos besoins, puis nous définissons ensemble un cahier des charges réaliste et cohérent avec le marché parisien, pour que votre recherche parte sur les bonnes bases dès le premier jour."
    5:
        title: Puis-je changer d'offre en cours de mission ?
        text: Oui, tout à fait. Si votre situation évolue en cours de recherche, vous pouvez basculer de l'offre Accompagné vers l'offre Confié à tout moment. Nous nous adaptons à vous, pas l'inverse.
    6:
        title: Pour qui est fait votre service ?
        text: "Notre service s'adresse à toute personne qui souhaite s'installer à Paris : expatriés en mission, familles en relocation, cadres, jeunes actifs, étudiants, entrepreneurs : tous ceux qui veulent poser leurs valises sans perdre de temps."
    7:
        title: Comment se déroule la recherche d'appartement ?
        text: Nous prenons en charge tout ce que vous n'avez pas le temps de gérer, <a href="%findAccommodationUrl%">de la sélection des biens jusqu'à la remise des clés</a>, en fonction de vos critères et de votre situation. Chaque accompagnement est unique, pensé sur mesure pour vous.
    8:
        title: Peut-on trouver un appartement à Paris sans se déplacer ?
        text: Oui, c'est exactement pour ça que nous existons. La plupart de nos clients sont à l'étranger ou en dehors de Paris au moment où ils commencent leur recherche. Nous gérons les visites, les échanges avec les propriétaires et le montage du dossier à votre place. <strong>Vous validez à distance, on s'occupe du reste.</strong>
    9:
        title: Est-ce que vos honoraires sont inclus dans le loyer ?
        text: "Non. Nos honoraires sont <strong>indépendants du loyer et des frais d'agence</strong>. Grâce à notre réseau exclusif et nos contacts directs avec les propriétaires, certains biens sont proposés sans frais d'agence, ce qui réduit significativement votre coût d'installation. <a href=\"%pricingUrl%\" class=\"underline underline-offset-4 hover:text-primary transition-colors duration-100 ease-out\">Découvrez nos formules et leurs tarifs</a>."
    10:
        title: Quels documents faut-il préparer pour un dossier locatif ?
        text: Pas d'inquiétude, nous vous envoyons la liste complète des documents à préparer dès la signature de votre contrat de mission. Chaque dossier est unique, votre expert vous guide personnellement selon votre situation pour constituer le dossier le plus solide possible.
    11:
        title: Quels types de biens proposez-vous ?
        text: Tout dépend de vos critères et de vos besoins. Studio, deux-pièces, grand appartement familial, meublé ou vide. Nous adaptons la recherche à votre situation. Notre accompagnement est 100% sur mesure, pas de catalogue préétabli.
    12:
        title: Quels arrondissements couvrez-vous ?
        text: Nous intervenons sur l'ensemble des 20 arrondissements de Paris ainsi que dans toute la petite couronne.
    13:
        title: Combien de logements me proposez-vous ?
        text: "Cela dépend du marché et de votre situation. Nous ne visons pas le volume, notre approche est qualitative : chaque bien sélectionné correspond réellement à vos critères."
    14:
        title: Vous occupez-vous des démarches administratives ?
        text: "Oui. Nous vous accompagnons sur les démarches essentielles à votre installation selon l'offre : ouverture des contrats d'électricité, de gaz, d'internet, mais aussi les démarches liées au visa et à votre situation administrative en France."
