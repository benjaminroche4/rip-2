            5:
                title: Qu'est-ce qui vous différencie ?
                text: Nous vous faisons gagner du temps, sécurisons votre dossier et vous donnons accès à des biens en avant-première.
            6:
                title: Trouvez-vous toujours un logement ?
                text: Grâce à notre expertise du marché parisien et à notre réseau, nous maximisons fortement vos chances de trouver un logement adapté à vos critères dans les meilleurs délais.
            7:
                title: "J'ai un profil atypique, pouvez-vous m'aider ?"
                text: "Oui, c'est notre spécialité. Entrepreneurs, expatriés, profils sans garant français : nous construisons un dossier solide et défendons votre candidature auprès de notre réseau de bailleurs."
            8:
                title: Sous combien de temps peut démarrer ma recherche ?
                text: Dès réception de vos critères, nous lançons la recherche sans attendre. Le marché parisien est tendu, chaque jour compte.
            9:
                title: Prenez-vous en charge l'ouverture des contrats ?
                text: Oui, nous prenons en charge l'ouverture de vos contrats d'électricité, gaz, internet et assurance habitation.
