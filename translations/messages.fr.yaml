        question:
            1:
                title: Qu’est-ce qu’un service de relocation à Paris ?
                text: Un service de relocation accompagne les particuliers et les professionnels dans leur <a href="%findAccommodationUrl%">recherche de logement</a> et leur installation à Paris, de manière simple et clé en main.
            2:
                title: À qui s’adressent vos services de relocation ?
                text: Nos services s’adressent aux particuliers, aux entreprises et aux professionnels souhaitant s’installer ou déménager à Paris.
            3:
                title: Combien de temps faut-il pour trouver un logement à Paris ?
                text: "En moyenne, nos clients signent leur bail en moins de 20 jours. Le délai dépend de votre budget et de vos critères : pour une estimation adaptée à votre projet, <a href=\"%callbackUrl%\" class=\"underline underline-offset-4 hover:text-primary transition-colors duration-100 ease-out\">demandez à être rappelé</a>."
