companies:
    title: Solutions pour les entreprises
    subTitle: Loger vos collaborateurs facilement à Paris
    text: "Un service clé en main pour loger vos talents à Paris : recherche, visites, dossiers et installation, avec un accompagnement dédié."
    trust:
        1: 5.0 basé sur
        2: avis
    service:
        title: Nos services
        subTitle: Nos solutions pour vos talents
        1:
            title: Recherche sur-mesure
            text: Une sélection de biens premium adaptée aux besoins de vos talents.
        2:
            title: Pilotage et reporting RH dédié
            text: Un interlocuteur unique pour un suivi de vos dossiers en temps réel.
        3:
            title: Support administratif
            text: Vos services et abonnements activés dès le premier jour.
        4:
            title: Installation clés en main
            text: Installation fluide pour des talents opérationnels dès le premier jour.
        5:
            title: Coordination logistique
            text: Nous orchestrons chaque prestataire pour un emménagement sans accroc.
        6:
            title: Immersion locale
            text: Une intégration locale réussie grâce à une prise de marques rapide.
    advantage:
        title: Une expérience unique
        subTitle: Faites de Paris l'atout majeur de vos recrutements
        text: Déléguez la complexité de la mobilité géographique à un partenaire expert.
        1:
            title: Gain de temps stratégique
            text: "Déléguez la complexité logistique et restez concentrés sur l’essentiel : la réussite de votre recrutement."
        2:
            title: Attractivité renforcée
            text: Augmentez vos chances de convaincre les meilleurs profils grâce à une expérience d'accueil d'exception.
        3:
            title: Expertise immobilière
            text: Bénéficiez d’un accès privilégié au marché parisien (off-market) et d’une sécurité totale dans la constitution de vos dossiers.
        4:
            title: Sérénité et confiance
            text: Un accompagnement sur-mesure et un interlocuteur dédié pour garantir une intégration sereine et immédiate.
    faq:
        title: Vos questions, nos réponses
        question:
            1:
                title: Quels services proposez-vous pour la relocation de nos collaborateurs ?
                text:  "Nous assurons un accompagnement complet, recherche de logement, démarches administratives et installation. Chaque mission est personnalisée pour garantir une arrivée fluide et en toute sérénité à Paris pour vos collaborateurs."
            2:
                title: Comment se déroule la prise en charge d’un collaborateur ?
                text: "Un conseiller dédié pilote chaque dossier jusqu’à la remise des clés. Le processus débute par l’analyse des besoins, le montage du dossier et la sélection des appartements."
            3:
                title: Travaillez-vous avec des entreprises internationales ?
                text: Oui. Nous accompagnons des entreprises françaises et internationales, avec une expertise reconnue en mobilité et relocation à Paris.
            4:
                title: Sous quel délai un collaborateur peut-il être installé ?
                text: Le délai dépend avant tout des besoins spécifiques du collaborateur (situation familiale, profil, quartier souhaité, etc.). En général, l’installation peut être réalisée sous 2 à 4 semaines.
            5:
                title: Comment est assuré le suivi RH ?
                text: À chaque étape, vous êtes informés par votre conseiller dédié, par e-mail, WhatsApp ou téléphone. Vous bénéficiez d’un suivi transparent et continu, au même titre que votre collaborateur.
            6:
                title: Pourquoi passer par une agence de relocation ?
                text: Faire appel à une agence de relocation facilite l’installation de vos collaborateurs, renforce votre attractivité auprès des meilleurs profils et vous fait gagner un temps précieux. Nous travaillons avec plus de 80 partenaires à Paris et disposons d’un réseau unique de logements off-market sur la capitale.
findAccommodation:
    title: Recherche de logement
    imageAlt: Recherche de logement à Paris avec Relocation In Paris
    subTitle: Votre logement clé en main à Paris
    text: "Confiez-nous la recherche de votre logement à Paris : un service clé en main, simple et sur-mesure."
    badge:
        1: Logements off-market
        2: Installation sous 20 jours
    process:
        approach: Notre approche
        title: Une recherche de logement personnalisée, pensée pour vous
        text1: Nous prenons le temps de comprendre vos besoins et de trouver à Paris un logement qui vous ressemble vraiment.
        eyebrow: Notre processus
        subTitle: Un accompagnement clair et éprouvé
    story:
        title: 'Confiance & sérénité'
        subTitle: Votre recherche, notre engagement
        text: "Depuis plus de dix ans, Relocation in Paris accompagne celles et ceux qui s'installent dans la capitale. De la sélection des biens à la constitution de votre dossier, nous prenons en charge chaque étape avec rigueur et bienveillance. Notre engagement : vous trouver le logement qui vous ressemble, sécuriser vos démarches et vous offrir une installation sereine, même à distance."
        award: 'Meilleure agence<br>à <span class="font-semibold">Paris 2025</span>'
    trust:
        1: 5.0 basé sur
        2: avis
    solution:
        title: Une installation sereine
        subTitle: Nos solutions pour votre logement
        1:
            title: Recherche sur-mesure
            text: Une sélection de logements adaptée à votre mode de vie et à vos critères.
        2:
            title: Réseau exclusif
            text: Accédez à des logements off-market grâce à notre réseau privilégié.
        3:
            title: Support administratif
            text: Tous vos services et abonnements activés dès le premier jour.
        4:
            title: Installation clés en main
            text: Nous gérons tout, vous n’avez plus qu’à valider votre logement.
        5:
            title: Conseiller dédié
            text: Un conseiller à vos côtés, du premier échange à la remise des clés.
        6:
            title: Immersion locale
            text: Une intégration locale réussie grâce à une prise de marques rapide.
    advantage:
        title: Une expérience sur-mesure
        subTitle: Faites de votre installation à Paris une transition fluide et maîtrisée
        1:
            title: Gain de temps immédiat
            text: "Recherche, visites, démarches : nous prenons tout en charge pendant que vous restez concentré sur l’essentiel. Vous ne courez plus après les annonces."
        2:
            title: Un dossier qui inspire confiance
            text: Sur un marché où les refus sont fréquents, nous construisons un dossier solide et rassurant pour les propriétaires, même sans garant français.
        3:
            title: Accès à des logements exclusifs
            text: Notre réseau de partenaires vous ouvre les portes de biens off-market, souvent avant qu’ils n’arrivent sur les plateformes. Vous voyez ce que les autres ne voient pas.
        4:
            title: Un interlocuteur unique, à vos côtés
            text: "Fini le sentiment d’être seul face aux démarches : un conseiller dédié vous guide à chaque étape, en français comme en anglais, jusqu’à la remise des clés."
        stats:
            relocations: Installations réussies
            partners: Partenaires immobiliers
            reviewsPrefix: Sur +
            reviews: avis Google
    faq:
        title: Vos questions, nos réponses
        question:
            1:
                title: Trouvez-vous toujours un logement ?
                text: Grâce à un réseau exclusif de plus de 80 partenaires et à un accès privilégié à des offres off-market, nous trouvons un logement adapté dans la quasi-totalité des situations.
            2:
                title: Quels types de logements proposez-vous ?
                text: Nous proposons une sélection de biens à Paris et en proche banlieue, meublés ou non, pour des locations de courte ou longue durée. Chaque recherche est entièrement personnalisée selon vos critères.
            3:
                title: Puis-je effectuer tout le processus à distance (depuis l’étranger) ?
                text: Oui. Nous accompagnons régulièrement des clients à distance, avec un processus entièrement réalisable en ligne (visites virtuelles, signatures et démarches administratives).
            4:
                title: En combien de temps puis-je m'installer à Paris ?
                text: En moyenne, nous finalisons une installation complète en quelques semaines seulement. Les délais peuvent varier selon vos besoins, la disponibilité des biens et vos critères. Grâce à notre réseau exclusif et notre parfaite connaissance du marché local, nous assurons une installation rapide.
            5:
                title: Quels types de profils accompagnez-vous ?
                text: "Nous accompagnons tous types de profils : familles, expatriés, cadres, étudiants et jeunes actifs. Nos services s’adressent à une clientèle française et internationale."
            6:
                title: Créez-vous le dossier locatif ?
                text: Oui. Notre offre est entièrement clé en main. Nous vous transmettons la liste des documents nécessaires à la création du dossier, puis nous nous occupons de l’ensemble des démarches jusqu’à sa validation.
    timeline:
        steps:
            1:
                title: Premier échange
                description: Nous prenons le temps de comprendre vos besoins, vos délais et vos priorités pour bâtir un accompagnement sur-mesure.
            2:
                title: Définition du projet
                description: Ensemble, nous définissons votre budget, la localisation idéale et vos critères essentiels pour cibler uniquement les biens qui vous correspondent.
                cards:
                    1: Paris intra/extra muros
                    2: Courte ou longue durée
                    3: Meublé ou non meublé
            3:
                title: Recherche ciblée
                description: Grâce à notre réseau exclusif de partenaires immobiliers, nous identifions rapidement les meilleures opportunités, souvent avant leur mise en ligne (off market).
                badge: Off market
            4:
                title: Organisation des visites
                description: Nous planifions les visites selon votre emploi du temps, en présentiel ou virtuellement, et vous conseillons à chaque étape de votre sélection.
                cards:
                    1: Visioconférence
                    2: Sur place
            5:
                title: Préparation et finalisation du dossier
                description: Nous préparons votre dossier locatif dès le début du processus afin d'être réactifs sur le marché. Après sélection du bien, nous finalisons les pièces nécessaires, négocions les meilleures conditions et gérons les formalités administratives.
            6:
                title: Signature du bail
                description: Nous restons à vos côtés lors de la signature et vous accompagnons dans la relecture des documents.
            7:
                title: Remise des clés et suivi
                description: Nous organisons la remise des clés, l'état des lieux d'entrée, et restons à vos côtés pour toute assistance post-installation.
