    5:
        text: Je me suis installé à Paris depuis Sydney pour un nouveau poste et je ne connaissais absolument pas le marché local. Tout a été organisé à distance et j’ai pu emménager dès mon arrivée. Une expérience fluide et parfaitement gérée.
