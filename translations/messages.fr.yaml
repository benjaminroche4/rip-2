        alt: "Photo de Olivia B., cliente satisfaite de Relocation In Paris"
    4:
        text: Arrivé de La Réunion pour m’installer à Paris, j’appréhendais un peu la recherche de logement à distance. Élodie a été très réactive et à l’écoute de mes critères. Appartement trouvé en 5 jours.
        name: Juliette M.
