companies:
    hero:
        caption: Relocation d'entreprise à Paris
        title: Logez vos collaborateurs à Paris, sans mobiliser vos équipes RH
        text: "Un conseiller dédié prend en charge chaque arrivée, de la recherche du logement à la remise des clés, en moins de 20 jours en moyenne."
        rating: "<strong class=\"font-semibold text-neutral-900\">%rating%</strong> sur +%count% avis %google%"
    cta:
        button: Parler à un conseiller
    logos:
        title: "Ils nous ont confié l'installation de leurs collaborateurs"
    why:
        caption: Pourquoi nous confier vos arrivées
        title: Le logement ne doit plus freiner vos recrutements
        stats:
            relocations: installations réussies à Paris
            partners: partenaires immobiliers dans la capitale
            reviews: "Sur +%count% avis %google%"
        1:
            title: Vos RH gagnent du temps
            text: "Un seul brief suffit. Nous gérons la recherche, les visites, le dossier et l'installation : vous validez uniquement les étapes clés."
        2:
            title: Vos recrues disent oui plus vite
            text: "Un logement trouvé avant l'arrivée lève le premier frein à la mobilité. Votre offre gagne en attractivité face aux autres employeurs."
        3:
            title: Un accès au marché off-market
            text: "Grâce à plus de 80 partenaires, vos collaborateurs accèdent à des biens qui ne sont jamais publiés sur les portails d'annonces."
        4:
            title: Des dossiers sécurisés
            text: "Dossier locatif complet, bail relu, état des lieux encadré : votre collaborateur s'installe sans mauvaise surprise."
    service:
        title: Ce qui est inclus
        subTitle: Tout ce dont votre collaborateur a besoin pour s'installer
        text: Une prestation clé en main, pensée pour les entreprises qui accueillent des talents à Paris, depuis la France ou l'étranger.
        1:
            title: Recherche sur-mesure
            text: "Une sélection de logements adaptés au budget, au quartier et à la situation familiale de votre collaborateur."
        2:
            title: Suivi RH dédié
            text: "Un interlocuteur unique pour votre entreprise, qui vous informe de l'avancement de chaque dossier."
        3:
            title: Dossier et bail
            text: "Montage du dossier locatif, négociation avec le propriétaire et relecture du bail avant signature."
        4:
            title: Installation clés en main
            text: "État des lieux, électricité, gaz et internet : votre collaborateur est opérationnel dès son arrivée."
        5:
            title: Visites à distance
            text: "Votre collaborateur est encore à l'étranger ? Nous visitons pour lui, en direct par vidéo, et il signe en ligne."
        6:
            title: Prise de repères à Paris
            text: "Quartiers, transports, écoles, démarches du quotidien : nos conseils pour une intégration rapide dans la ville."
    process:
        caption: Notre méthode
        title: Un processus simple, piloté de bout en bout
        text: "Vous nous confiez le besoin, nous orchestrons le reste. À chaque étape, vous savez où en est le dossier de votre collaborateur."
        eyebrow: Étape par étape
        subTitle: De votre brief à la remise des clés
        steps:
            1:
                title: Brief avec votre équipe RH
                description: "Nous définissons ensemble le besoin : date d'arrivée, budget, durée de location, quartiers et situation familiale du collaborateur."
            2:
                title: Recherche ciblée
                description: "Nous activons notre réseau et présélectionnons les logements qui correspondent au cahier des charges, y compris hors marché."
                chips:
                    1: Biens off-market
                    2: Meublé ou vide
            3:
                title: Visites sur place ou en vidéo
                description: "Nous visitons chaque bien et partageons nos retours. Votre collaborateur peut suivre la visite en direct, où qu'il soit."
            4:
                title: Dossier, négociation et bail
                description: "Nous montons un dossier solide, négocions les conditions et relisons le bail avant la signature."
            5:
                title: Installation et suivi
                description: "État des lieux, remise des clés, ouverture des contrats essentiels : votre collaborateur arrive dans un logement prêt à vivre."
    useCases:
        caption: Pour quelles situations
        title: Une solution pour chaque type de mobilité
        text: "Transfert depuis l'étranger, recrutement, mission courte ou arrivée en famille : nous adaptons la recherche à chaque situation."
        1:
            title: Mutation internationale
            text: "Votre collaborateur arrive de l'étranger : nous gérons tout à distance, pour qu'il ait un logement dès son arrivée."
        2:
            title: Nouveau recrutement
            text: "Un candidat hésite à rejoindre Paris ? Proposer l'accompagnement au logement fait souvent la différence."
        3:
            title: Mission de quelques mois
            text: "Pour une mission temporaire, nous ciblons les locations meublées et le bail mobilité, de 1 à 10 mois."
        4:
            title: Cadres et familles
            text: "Quartiers familiaux, proximité des écoles, surfaces adaptées : nous trouvons le logement qui convient à toute la famille."
    reporting:
        caption: Un suivi transparent
        title: Vous savez toujours où en est chaque dossier
        text: "Depuis %year%, nos agents parisiens accompagnent particuliers et entreprises. Votre <strong class=\"font-semibold text-neutral-800\">conseiller dédié</strong> vous tient informés par <strong class=\"font-semibold text-neutral-800\">e-mail, WhatsApp ou téléphone</strong>, au même titre que votre collaborateur."
    faq:
        title: Vos questions, nos réponses
        subTitle: Les questions des équipes RH
        question:
            1:
                title: Quelles démarches prenez-vous en charge pour nos collaborateurs ?
                text: "Tout ce qu’implique une installation à Paris : <strong>logement</strong> (y compris temporaire), dossier et bail, <strong>visa</strong>, <strong>scolarité des enfants</strong> et ouverture des contrats d’énergie et d’internet. Le détail de chaque offre est sur notre <a href=\"%pricingUrl%\">page tarifs</a>."
            2:
                title: Comment se déroule la prise en charge d’un collaborateur ?
                text: "Tout commence par un brief avec votre équipe RH pour définir le besoin. Un conseiller dédié pilote ensuite la recherche, les visites et le dossier, jusqu’à la remise des clés."
            3:
                title: Travaillez-vous avec des entreprises internationales ?
                text: "Oui. Nous accompagnons des entreprises françaises et internationales, et nos conseillers échangent avec vos équipes comme avec vos collaborateurs en français, en anglais, en espagnol ou en allemand."
            4:
                title: Sous quel délai un collaborateur peut-il être installé ?
                text: En moyenne, nos clients signent leur bail <strong>en moins de 20 jours</strong>. Le délai dépend du profil du collaborateur (situation familiale, budget, quartier souhaité).
            5:
                title: Comment est assuré le suivi RH ?
                text: "À chaque étape, votre conseiller dédié vous informe par e-mail, WhatsApp ou téléphone. Vous bénéficiez d’un suivi transparent et continu, au même titre que votre collaborateur."
            6:
                title: Pourquoi passer par une agence de relocation ?
                text: "Une agence de relocation fait gagner un temps précieux à vos équipes, sécurise l’installation de vos collaborateurs et renforce votre attractivité auprès des meilleurs profils. Nous travaillons avec plus de 80 partenaires à Paris et disposons d’un réseau de logements off-market."
            7:
                title: Notre collaborateur est encore à l’étranger, est-ce un problème ?
                text: "Non. La plupart des démarches se font à distance : nous visitons pour lui, il suit les visites en vidéo et signe en ligne. Il peut ainsi arriver à Paris avec un logement déjà prêt."
            8:
                title: Quelle solution pour une mission de quelques mois ?
                text: "Pour une mission temporaire, nous ciblons les locations meublées, notamment le <strong>bail mobilité</strong>, d’une durée de 1 à 10 mois, réservé entre autres aux personnes en mutation professionnelle ou en mission temporaire."
            9:
                title: Combien coûte l’accompagnement d’un collaborateur ?
                text: "Deux offres, selon le niveau d’accompagnement souhaité : <strong>Accompagné à 1 490 €</strong> et <strong>Confié à 2 190 €</strong>. Le détail de chaque offre est présenté sur notre <a href=\"%pricingUrl%\">page tarifs</a>."
            10:
                title: Notre collaborateur n’a pas de garant en France, est-ce bloquant ?
                text: "Non. Il existe des alternatives au garant, comme la <strong>garantie Visale</strong> (sous conditions d’éligibilité) ou une caution bancaire. Pour un collaborateur expatrié sans garant ni fiches de paie françaises, nous construisons un dossier solide et le défendons auprès de notre réseau de propriétaires."
            11:
                title: Peut-il être logé le temps de la recherche ?
                text: "Oui. Si votre collaborateur arrive à Paris avant d’avoir trouvé son logement, nous lui proposons <strong>un logement temporaire le temps de la recherche</strong>, pour qu’il soit opérationnel dès son arrivée."
            12:
                title: Accompagnez-vous aussi le visa ou la scolarité des enfants ?
                text: "Oui. Au-delà du logement, nous accompagnons les démarches liées au visa, la scolarité des enfants, la découverte des quartiers et des services de conciergerie. Ces services sont présentés sur notre <a href=\"%pricingUrl%\">page tarifs</a>."
            13:
                title: Que se passe-t-il si vous ne trouvez pas de logement ?
                text: "Nous n’acceptons pas une mission sans être certains de la réussir. Avec <strong>plus de 900 installations réussies</strong> et plus de 80 partenaires à Paris, nous n’avons jamais laissé un client sans clés."
