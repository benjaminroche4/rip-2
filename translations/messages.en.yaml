            4:
                number: 12
                text: experts dedicated to managing your assets.
    price:
        fees:
            button: Speak with an expert
    story:
        title: 'Trust & discretion'
        subTitle: A contact who knows your property
        text: "Entrusting your apartment is a real decision. With us, you are not just a number: <strong class=\"font-semibold text-neutral-800\">a dedicated Paris agent</strong> looks after your property, <strong class=\"font-semibold text-neutral-800\">answers you directly</strong> and keeps you informed at every key step. Our team speaks French, English, Spanish and German, <strong class=\"font-semibold text-neutral-800\">wherever you live</strong>."
        award: 'Best agency<br>in <span class="font-semibold">Paris in %year%</span>'
    faq:
        title: FAQ
        subTitle: Your questions, our answers
        text: "The questions property owners ask most. Find all our answers in our <a href='%url%#property-management' class='underline underline-offset-4 decoration-dotted decoration-slate-500 hover:decoration-primary hover:text-primary transition duration-100'>general FAQ</a>."
        question:
            1:
                title: Do you manage short-, medium- and long-term rentals?
                text: Yes. We provide property management services for short-term rentals (up to 30 days), medium-term rentals (from 1 to 6 months) and long-term rentals (over 6 months), with an approach tailored to each rental type.
            2:
                title: Do you enhance the property before it is listed?
                text: Yes. We enhance the property with a professional photo shoot, then handle its presentation, positioning and distribution to attract high-quality tenants and optimize rental performance.
            3:
                title: Do you handle everything from start to finish?
                text: "Absolutely. We take care of the entire management process: strategy, listing, tenant relations, operational follow-up and income management. You stay in control, we handle the rest."
            4:
                title: Do you develop a strategy to optimize my income?
                text: "Yes. Each property is analyzed individually to define the most relevant rental strategy, based on its location, market demand and your objectives. To get started, <a href=\"%landlordsUrl%#estimation-card\">estimate your property’s rent</a>."
            5:
                title: Do you manage communication with tenants or guests?
                text: Yes. We handle all communication before, during and after the stay or rental, ensuring professional and responsive follow-up.
            6:
                title: Can I track the income generated?
                text: Yes. You benefit from clear and regular income tracking, with full visibility on your property’s performance.
            7:
                title: Is there a minimum commitment period?
                text: No. Our service comes with <strong>no minimum commitment</strong>, within a partnership built on trust and transparency.
            8:
                title: Do I need to pay any upfront fees?
                text: "No. There are <strong>no setup fees or upfront costs</strong>: our remuneration is aligned with your property’s performance. <a href=\"%contactUrl%\">Contact us</a> to discuss it."
            9:
                title: What tenant profiles do you offer?
                text: "Through our relocation business, we support executives, expatriates and <a href=\"%companiesUrl%\">corporate employees</a> looking for a home in Paris. We offer these <strong>premium profiles</strong> your property first, with verified applications and solid guarantees."
