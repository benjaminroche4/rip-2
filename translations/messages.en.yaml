        text: We manage every stage of the rental process with rigor, securing your income and enhancing the long-term value of your property. You stay in control, we take care of the rest.
        text2: Your income secured, your property protected, your time preserved.
        imageAlt: Haussmann building in Paris managed by Relocation in Paris
        keyPoints:
            1:
                text: Exposure across leading international property platforms.
            2:
                number: 250
                text: properties managed in Paris and the Île-de-France region.
            3:
