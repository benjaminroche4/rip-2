faq:
    title: FAQ
    subTitle: Frequently Asked Questions About Relocating to Paris
    intro: "Relocation, home search, application, plans, companies and landlords: all our answers, sorted by topic."
    nav:
        title: Topics
        label: FAQ topics
    help:
        title: Can't find your answer?
        text: Ask us directly, one of our experts will get back to you.
        button: Ask my question
    categories:
        relocation: Relocating to Paris
        homeSearch: Finding a home
        rentingRules: "Renting in Paris: the rules"
        application: Application and paperwork
        plansAndFees: Plans and fees
        companies: Companies
        propertyManagement: Property management
    more:
        beyondHousing:
            title: Can you help with visas, schooling or concierge services?
            text: "Yes. Beyond housing, we support you with visa procedures, discovering neighbourhoods, your children's schooling and concierge services, so that nothing is left to chance when you settle in Paris. These services are presented on our <a href=\"%pricingUrl%\">pricing page</a>."
        languages:
            title: Which languages do you work in?
            text: "Our team supports clients in French, English, Spanish and German, from the first conversation to the handover of the keys."
        contact:
            title: How can I contact you or request a callback?
            text: "By phone or through our <a href=\"%contactUrl%\">contact form</a>. You can also <a href=\"%callbackUrl%\">request a callback</a>: pick a time slot and an expert will call you to discuss your project."
        whenToStart:
            title: How long before my arrival should I start my search?
            text: <strong>As early as possible.</strong> Starting early lets us show you as many properties as possible and spot the best offers before they are gone, in a Paris market where good homes are let very quickly. <a href="%contactUrl%">Contact us</a> as soon as your plans take shape.
        temporaryHousing:
            title: Do you offer temporary housing during the search?
            text: "Yes, absolutely. If you arrive in Paris before finding your home, <strong>we offer temporary housing for the duration of the search</strong>, so you can settle in calmly from day one."
        ourProperties:
            title: How can I visit a property listed on your site?
            text: "The properties on our <a href=\"%propertiesUrl%\">Our properties</a> page are homes for rent in Paris from our network. Contact us with the property you are interested in: we organise the visit, in person or remotely."
        guarantor:
            title: Do I need a guarantor to rent in Paris?
            text: "Not necessarily. Landlords often ask for a guarantor, but there are alternatives: <strong>the Visale guarantee</strong>, free and provided by Action Logement subject to eligibility, a bank guarantee, or rent default insurance taken out by the landlord. For expats without a guarantor in France, <a href=\"%findAccommodationUrl%\">we build a strong application</a> and champion it with our network of landlords."
        furnishedVsUnfurnished:
            title: "Furnished or unfurnished rental: what are the differences?"
            text: "An unfurnished lease runs for <strong>at least 3 years</strong> with a private landlord, a furnished lease for <strong>1 year (9 months for a student)</strong>. The security deposit is capped at 1 month's rent excluding charges for an unfurnished rental and 2 months for a furnished one. In Paris, a high-demand area, tenants can leave with <strong>one month's notice in both cases</strong>. Find detailed advice on <a href=\"%blogUrl%\">our blog</a>."
        mobilityLease:
            title: What is a mobility lease (bail mobilité)?
            text: "The mobility lease is a <strong>furnished lease of 1 to 10 months</strong>, non-renewable, reserved for people in vocational training, higher education, apprenticeship, internship, civic service, professional transfer or temporary assignment. <strong>No security deposit can be requested</strong> and the tenant can leave at any time with one month's notice. A good fit for an assignment or a temporary stay in Paris: to relocate your employees, discover our <a href=\"%companiesUrl%\">corporate offer</a>."
        rentControl:
            title: How does rent control work in Paris?
            text: "In Paris, the rent excluding charges cannot exceed an <strong>increased reference rent</strong>, set every year by prefectoral order according to the neighbourhood, the number of rooms, the construction period and the type of rental (furnished or unfurnished). A rent supplement is only allowed for exceptional features of the home, and the lease must state the reference rent and the increased reference rent."
        moveInCosts:
            title: What costs should I expect when moving in?
            text: "Plan for the first month's rent and charges, <strong>the security deposit</strong> (1 month's rent excluding charges for an unfurnished rental, 2 months for a furnished one), any fees from the landlord's agency, capped by law according to the surface area, and <strong>your home insurance</strong>, usually required from the key handover. <a href=\"%pricingUrl%\">Our relocation fees</a> are separate from these costs."
        prices:
            title: How much do your plans cost?
            text: "The Guided plan costs <strong>€1,490</strong> and the Entrusted plan <strong>€2,190</strong>. See what each plan includes on our <a href=\"%pricingUrl%\">pricing page</a>."
        rentEstimate:
            title: How can I estimate the rent of my property?
            text: "Fill in our <a href=\"%landlordsUrl%\">estimation form</a> in a few minutes: an expert analyses your property (location, surface area, amenities, rental type) and gets back to you with an estimate of your rental income."
    notes:
        propertyManagement:
            title: Property management in partnership with TheKonciergerie
            text: "Our property management is provided in collaboration with our partner <a href=\"%partnerUrl%\" rel=\"noopener noreferrer\" target=\"_blank\">TheKonciergerie</a>."
    plans:
        difference:
            title: What is the difference between the Guided and Entrusted plans?
            text: "With the Guided plan, you save weeks of searching: <strong>you visit, we handle everything else</strong> (tailored search, access to off-market properties, application optimisation, handling of applications and follow-ups). With the Entrusted plan, <strong>we handle everything from search to full installation</strong>: your agent attends the visits, sends you a video report after each one and supports you until the keys are handed over. You just have to approve."
    1:
        title: What happens if you don't find me an apartment?
        text: We never take on a mission without being confident we can deliver. With <strong>over 900 successful relocations</strong> and a unique partner network across Paris, we have never left a client without keys.
    2:
        title: How quickly can you find an apartment?
        text: On average, our clients sign their lease in <strong>under 20 days</strong>. In a market as competitive as Paris, that's the difference between searching alone and searching with us.
    3:
        title: My profile is atypical, can you still help me?
        text: That's exactly why we exist. Expats without French payslips, freelancers, foreigners without a guarantor. Our network of partner landlords trusts us, and that trust gets your application through.
    4:
        title: Is my budget realistic for finding a good apartment in Paris?
        text: "We take on searches <strong>from a monthly rent of €1,000</strong>. We always start with an in-depth conversation to understand your needs, then define together a realistic brief aligned with the Paris market, so your search starts on the right footing from day one."
    5:
        title: Can I switch plans during my mission?
        text: Yes, absolutely. If your situation changes during the search, you can move from the Guided offer to the Entrusted offer at any time. We adapt to you, not the other way around.
    6:
        title: Who is your service for?
        text: Our service is for anyone looking to settle in Paris. Expats on assignment, relocating families, executives, young professionals, students, entrepreneurs. Anyone who wants to move in without losing time.
    7:
        title: How does the apartment search work?
        text: We handle everything you don't have time to manage, <a href="%findAccommodationUrl%">from shortlisting properties to handing over the keys</a>, based on your criteria and your situation. Every search is unique, built entirely around you.
    8:
        title: Can I find an apartment in Paris without travelling there?
        text: Yes, that's exactly what we're here for. Most of our clients are abroad or outside Paris when they begin their search. We handle viewings, landlord negotiations, and application files on your behalf. <strong>You approve from a distance, we handle the rest.</strong>
    9:
        title: Are your fees included in the rent?
        text: "No. Our fees are <strong>independent of the rent and any agency fees</strong>. And thanks to our exclusive network and direct relationships with landlords, many properties come with no agency fees at all, significantly reducing your total move-in cost. <a href=\"%pricingUrl%\" class=\"underline underline-offset-4 hover:text-primary transition-colors duration-100 ease-out\">See our packages and prices</a>."
    10:
        title: What documents do I need for a rental application?
        text: No need to worry, we send you a full document checklist as soon as your mission contract is signed. Every file is different, and your dedicated expert will guide you personally based on your situation to build the strongest possible application.
    11:
        title: What types of properties do you offer?
        text: It depends entirely on your criteria and needs. Studios, one-bedrooms, large family apartments, furnished or unfurnished. We tailor the search to your situation. No pre-set catalogue, just a search built around you.
    12:
        title: Which areas of Paris do you cover?
        text: We operate across all 20 arrondissements of Paris and throughout the inner suburbs.
    13:
        title: How many properties will you show me?
        text: It depends on the market and your situation. We don't aim for volume. Our approach is quality-driven, every property we present is a genuine match for your criteria.
    14:
        title: Do you handle administrative formalities?
        text: Yes. Depending on your offer, we support you with the essential steps of settling in, setting up electricity, gas and internet contracts, as well as visa-related procedures and your administrative situation in France.
