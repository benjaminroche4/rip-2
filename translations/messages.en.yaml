companies:
    hero:
        caption: Corporate relocation in Paris
        title: House your employees in Paris without tying up your HR team
        text: "A dedicated advisor handles every arrival, from the housing search to the key handover, in under 20 days on average."
        rating: "<strong class=\"font-semibold text-neutral-900\">%rating%</strong> from %count%+ %google% reviews"
    cta:
        button: Talk to an advisor
    logos:
        title: "They trusted us to relocate their employees"
    why:
        caption: Why entrust us with your arrivals
        title: Housing should no longer hold back your hiring
        stats:
            relocations: successful relocations in Paris
            partners: real estate partners across the city
            reviews: "From %count%+ %google% reviews"
        1:
            title: Your HR team saves time
            text: "One brief is all it takes. We handle the search, viewings, application and move-in: you only approve the key steps."
        2:
            title: Your hires say yes faster
            text: "Finding a home before arrival removes the first barrier to mobility. Your offer stands out against other employers."
        3:
            title: Access to off-market listings
            text: "Through more than 80 partners, your employees access properties that never appear on listing websites."
        4:
            title: Secure applications
            text: "Complete rental application, lease review, supervised check-in: your employee moves in with no bad surprises."
    service:
        title: What is included
        subTitle: Everything your employee needs to settle in
        text: A turnkey service designed for companies welcoming talent to Paris, from elsewhere in France or abroad.
        1:
            title: Tailored search
            text: "A selection of homes matching your employee’s budget, preferred neighborhood and family situation."
        2:
            title: Dedicated HR follow-up
            text: "A single point of contact for your company, who keeps you posted on the progress of each file."
        3:
            title: Application and lease
            text: "Rental application, negotiation with the landlord and lease review before signing."
        4:
            title: Turnkey move-in
            text: "Check-in, electricity, gas and internet: your employee is ready from day one."
        5:
            title: Remote viewings
            text: "Is your employee still abroad? We visit on their behalf, live on video, and they sign online."
        6:
            title: Getting to know Paris
            text: "Neighborhoods, transport, schools, everyday paperwork: our advice for a fast integration into the city."
    process:
        caption: Our method
        title: A simple process, managed end to end
        text: "You share the need, we orchestrate the rest. At every step, you know where your employee’s file stands."
        eyebrow: Step by step
        subTitle: From your brief to the key handover
        steps:
            1:
                title: Brief with your HR team
                description: "Together we define the need: arrival date, budget, lease length, neighborhoods and the employee’s family situation."
            2:
                title: Targeted search
                description: "We activate our network and shortlist the homes that meet the brief, including off-market ones."
                chips:
                    1: Off-market listings
                    2: Furnished or unfurnished
            3:
                title: On-site or video viewings
                description: "We visit every property and share our feedback. Your employee can join the viewing live, wherever they are."
            4:
                title: Application, negotiation and lease
                description: "We build a strong application, negotiate the terms and review the lease before signing."
            5:
                title: Move-in and follow-up
                description: "Check-in, key handover, essential contracts opened: your employee arrives in a home ready to live in."
    useCases:
        caption: Which situations
        title: A solution for every kind of mobility
        text: "Transfer from abroad, new hire, short assignment or a family move: we tailor the search to each situation."
        1:
            title: International transfer
            text: "Your employee is coming from abroad: we handle everything remotely, so they have a home when they land."
        2:
            title: New hire
            text: "A candidate is hesitant about moving to Paris? Offering housing support often makes the difference."
        3:
            title: Assignment of a few months
            text: "For a temporary assignment, we focus on furnished rentals and the mobility lease, from 1 to 10 months."
        4:
            title: Executives and families
            text: "Family-friendly neighborhoods, nearby schools, the right floor area: we find the home that suits the whole family."
    reporting:
        caption: Transparent follow-up
        title: You always know where each file stands
        text: "Since %year%, our Paris agents have supported individuals and companies. Your <strong class=\"font-semibold text-neutral-800\">dedicated advisor</strong> keeps you updated by <strong class=\"font-semibold text-neutral-800\">email, WhatsApp or phone</strong>, just like your employee."
    faq:
        title: Your questions, our answers
        subTitle: Questions from HR teams
        question:
            1:
                title: Which steps do you handle for our employees?
                text: "Everything a move to Paris involves: <strong>housing</strong> (temporary too), application and lease, <strong>visa</strong>, <strong>children’s schooling</strong> and setting up energy and internet. See our <a href=\"%pricingUrl%\">pricing page</a> for what each plan includes."
            2:
                title: How is an employee’s relocation handled?
                text: "It all starts with a brief with your HR team to define the need. A dedicated advisor then manages the search, viewings and application, all the way to the key handover."
            3:
                title: Do you work with international companies?
                text: "Yes. We support French and international companies, and our advisors work with your teams and your employees in French, English, Spanish or German."
            4:
                title: How quickly can an employee be settled in?
                text: On average, our clients sign their lease <strong>in under 20 days</strong>. The timeline depends on the employee’s profile (family situation, budget, preferred neighborhood).
            5:
                title: How is HR kept informed?
                text: "At every step, your dedicated advisor updates you by email, WhatsApp or phone. You get transparent, continuous follow-up, just like your employee."
            6:
                title: Why use a relocation agency?
                text: "A relocation agency saves your teams valuable time, secures your employees’ move and makes you more attractive to top talent. We work with more than 80 partners in Paris and have a network of off-market homes."
            7:
                title: Our employee is still abroad, is that a problem?
                text: "No. Most of the process happens remotely: we visit on their behalf, they follow viewings on video and sign online. They can arrive in Paris with a home already waiting."
            8:
                title: What solution for an assignment of a few months?
                text: "For a temporary assignment, we focus on furnished rentals, including the <strong>mobility lease</strong> (bail mobilité), lasting 1 to 10 months and available, among others, to people on a professional transfer or temporary assignment."
            9:
                title: How much does relocating an employee cost?
                text: "Two plans, depending on the level of support you need: <strong>Guided at €1,490</strong> and <strong>Entrusted at €2,190</strong>. What each plan includes is detailed on our <a href=\"%pricingUrl%\">pricing page</a>."
            10:
                title: Our employee has no guarantor in France, is that a problem?
                text: "No. There are alternatives to a guarantor, such as the <strong>Visale guarantee</strong> (subject to eligibility) or a bank guarantee. For an expatriate employee with no guarantor or French payslips, we build a strong application and defend it with our network of landlords."
            11:
                title: Can they be housed during the search?
                text: "Yes. If your employee arrives in Paris before finding a home, we offer them <strong>temporary housing during the search</strong>, so they are ready to work from day one."
            12:
                title: Do you also help with visas or children’s schooling?
                text: "Yes. Beyond housing, we help with visa procedures, children’s schooling, discovering neighborhoods and concierge services. These services are listed on our <a href=\"%pricingUrl%\">pricing page</a>."
            13:
                title: What happens if you do not find a home?
                text: "We never take on an assignment unless we are sure we can succeed. With <strong>more than 900 successful relocations</strong> and more than 80 partners in Paris, we have never left a client without keys."
