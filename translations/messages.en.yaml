companies:
    title: Corporate Services
    subTitle: Corporate Housing in Paris, Made Simple
    text: "A turnkey service to relocate your talent to Paris: search, viewings, applications, and move-in support with dedicated assistance."
    trust:
        1: 5.0 based on
        2: reviews
    service:
        title: Our services
        subTitle: Solutions designed for your talent
        1:
            title: Tailored housing search
            text: A curated selection of premium properties aligned with your talent’s needs.
        2:
            title: Dedicated HR coordination and reporting
            text: A single point of contact providing real-time tracking of your cases.
        3:
            title: Administrative support
            text: All services and subscriptions activated from day one.
        4:
            title: Turnkey move-in
            text: A seamless setup ensuring your talent is operational from day one.
        5:
            title: Logistics coordination
            text: We orchestrate every service provider for a smooth and stress-free move-in.
        6:
            title: Local immersion
            text: Successful local integration through fast orientation and city familiarization.
    advantage:
        title: A unique experience
        subTitle: Make Paris a key asset in your recruitment strategy
        text: Delegate the complexity of geographic mobility to an expert partner.
        1:
            title: Strategic time savings
            text: "Delegate logistical complexity and stay focused on what matters most: successful recruitment."
        2:
            title: Enhanced employer attractiveness
            text: Increase your chances of securing top talent with an exceptional onboarding experience.
        3:
            title: Real estate expertise
            text: Benefit from privileged access to the Parisian market (off-market) and full security in building your files.
        4:
            title: Peace of mind and trust
            text: Tailored support and a dedicated point of contact to ensure a smooth and immediate integration.
    faq:
        title: Your questions, our answers
        question:
            1:
                title: What relocation services do you offer for our employees?
                text: "We provide end-to-end support, including housing search, administrative procedures, and move-in coordination. Each assignment is fully tailored to ensure a smooth and stress-free arrival in Paris for your employees."
            2:
                title: How does the employee onboarding process work?
                text: "A dedicated consultant manages each case through to key handover. The process begins with a needs assessment, followed by file preparation and the selection of suitable apartments."
            3:
                title: Do you work with international companies?
                text: "Yes. We support both French and international companies, with recognized expertise in employee mobility and relocation in Paris."
            4:
                title: How long does it take to relocate an employee?
                text: "The timeline primarily depends on the employee’s specific needs (family situation, profile, preferred neighborhoods, etc.). In most cases, relocation can be completed within 2 to 4 weeks."
            5:
                title: How is HR follow-up handled?
                text: "At every stage, you are kept informed by your dedicated consultant via email, WhatsApp, or phone. You benefit from transparent and continuous HR follow-up, just like your employee."
            6:
                title: Why work with a relocation agency?
                text: "Working with a relocation agency simplifies employee relocation, strengthens your employer brand, and saves valuable time. We collaborate with over 80 partners in Paris and provide access to a unique off-market housing network across the city."
findAccommodation:
    title: Property Search
    imageAlt: Finding a home in Paris with Relocation In Paris
    subTitle: Your Turnkey Housing Solution in Paris
    text: "Let us handle your home search in Paris: a turnkey service that is simple and tailored to you."
    badge:
        1: Off-market homes
        2: Move-in within 20 days
    process:
