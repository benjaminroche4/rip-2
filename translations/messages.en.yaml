        text: Delegate the rigorous search for your next tenant to an expert partner and enjoy a smooth, secure letting process with zero hassle.
        1:
            title: Real time savings
            text: We handle calls, screen enquiries, and organize viewings so you stay free of constraints. You avoid time-consuming tasks while keeping the final say.
        2:
            title: Protect your asset
            text: We review every supporting document to reduce the risk of non-payment. We target profiles with proven strong financial capacity.
        3:
            title: Respect for your property
            text: We prioritize tenants known for their care and stability, ensuring your asset is well maintained.
        4:
            title: Exclusive network
            text: We share your listing with our private network and international relocation agencies, giving you access to premium candidates often absent from traditional portals.
    faq:
        question:
            1:
                title: Do I still have the final say in choosing the tenant?
                text: Absolutely. Our role is to screen, pre-qualify, and present the 2 or 3 strongest applications. We share our analysis, but the final decision to sign the lease remains entirely yours.
            2:
                title: What is the average time to find the right tenant?
                text: "Thanks to our pool of already qualified candidates, we typically find the ideal tenant <span class='font-semibold'>in under 10 days</span>."
            3:
                title: What exactly is included in your “turnkey” service?
                text: "We handle everything: valuation, professional photography, targeted distribution, viewings, and rigorous screening. You simply approve the final candidate and prepare your lease."
            4:
                title: What do you need to get started?
                text: "It’s very simple: we only need the signed search mandate and a set of keys."
            5:
                title: Do you require an exclusivity mandate on the property?
                text: "Our service includes a 15-day exclusivity period to ensure immediate action and maximum mobilization of our network."
