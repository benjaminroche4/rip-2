; Loaded by the Symfony CLI local server on top of the system php.ini.
; The listing form accepts up to 15 photos of 8 MB each: the PHP defaults
; (upload_max_filesize=2M, post_max_size=8M) reject them before the Symfony
; constraints even run. Mirror of public/.user.ini for production.
upload_max_filesize = 10M
post_max_size = 160M
max_file_uploads = 20
