; o2switch (PHP FastCGI/LSAPI) reads .user.ini next to the executed script.
; The listing form accepts up to 15 photos of 8 MB each: the PHP defaults
; reject them before the Symfony constraints even run. Mirror of /php.ini
; used by the local dev server.
upload_max_filesize = 10M
post_max_size = 160M
max_file_uploads = 20
